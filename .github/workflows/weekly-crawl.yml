name: Cập nhật sách hàng tuần

on:
  schedule:
    - cron: "17 19 * * 0"   # 02:17 sáng thứ Hai giờ Việt Nam (19:17 UTC Chủ nhật)
  workflow_dispatch: {}     # cho phép bấm chạy tay trên tab Actions
  push:
    branches: [main]
    paths: [scripts/**, data/links.json, .github/workflows/**]

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl hackerbooks.org
        run: node scripts/crawl.mjs
      - name: Lấy ảnh bìa từ Open Library (có cache)
        run: node scripts/covers.mjs
      - name: Việt hóa tên sách mới (nếu có ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate.mjs
      - name: Commit nếu có thay đổi (Vercel tự deploy lại)
        run: |
          git config user.name "hackerbooks-vi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "data: cập nhật $(date -u +%F)"
          git push
